name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "css/**"
      - "js/**"
      - "icons/**"
      - "vendor/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Put the site and the web app together
        run: |
          mkdir -p _site/app
          cp -R site/. _site/
          cp -R index.html manifest.webmanifest sw.js css js icons vendor _site/app/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
